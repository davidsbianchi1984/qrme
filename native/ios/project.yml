# XcodeGen spec — generates QrmeStudio.xcodeproj.
#   brew install xcodegen && xcodegen generate && open QrmeStudio.xcodeproj
name: QrmeStudio
options:
  bundleIdPrefix: app.qrme
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  QrmeStudio:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrme.studio
        MARKETING_VERSION: "2.9.2"
        CURRENT_PROJECT_VERSION: "2009002"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    # A generated Info.plist and an `info:` block are mutually exclusive:
    # GENERATE_INFOPLIST_FILE takes scalar INFOPLIST_KEY_* settings only, and
    # NSAppTransportSecurity is a dictionary. So the plist is written here —
    # and `path` is required, which is what the spec was missing.
    #
    # Kept outside Sources/ so XcodeGen does not also sweep the file it just
    # generated into the target as a resource.
    info:
      path: QrmeStudio-Info.plist
      properties:
        CFBundleDisplayName: QRME
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required before AVCaptureSession may run: iOS terminates the app
        # outright if a camera is opened without this string.
        # The people in your phone. Read once per press of sync, never in the
        # background: names and one number each go up under a grant the
        # person can withdraw, and withdrawing drops the book server-side.
        NSContactsUsageDescription: >-
          QRME syncs the names in your contacts, with your permission, so a
          profile can recognise who a caller is to you. Numbers are matched
          and never shown back; withdrawing the permission deletes the book.
        NSCameraUsageDescription: >-
          QRME reads beacon QR codes so a profile can appear on the sticker
          in front of you. Frames stay on the device; only the code's id is
          sent.
        # Required before AVAudioRecorder may run, for the same reason: iOS
        # kills the app if the mic opens without it. Voice enrollment records
        # to this app's container and sends only the measurements — and a
        # conversation taken along keeps the microphone open while the person
        # is in other apps, which this string has to say too. It is what
        # somebody reads in Settings months later, and describing only the
        # gentler half would be true of one feature and false of the product.
        NSMicrophoneUsageDescription: >-
          QRME records a sample of your own voice so your profile can speak in
          it, with your permission — and, if you choose to take a conversation
          with you, listens while you are in other apps. iOS shows an orange
          dot in the status bar for as long as it is listening, and the
          conversation ends the moment you end it.
        # Speech recognition is its own permission, and its own refusal.
        NSSpeechRecognitionUsageDescription: >-
          QRME turns what you say into words so a profile can answer. On
          phones that support it this happens on the device, and the audio
          does not leave your phone.
        # The conversation you took with you, out of the app entirely.
        #
        #     asked     can the conversation survive a screen change
        #     mattered  can it survive leaving the application
        #
        # `audio` is what lets an active AVAudioSession keep running once
        # this app is no longer on screen. The orange indicator the system
        # then draws is the point rather than a side effect: it is the
        # difference between a conversation somebody is carrying and an app
        # recording them after they left it.
        UIBackgroundModes:
          - audio
        # Allow http://127.0.0.1:8000 in the Simulator (local dev backend).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
