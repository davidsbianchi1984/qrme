# XcodeGen spec — generates QrmeStudio.xcodeproj.
#   brew install xcodegen && xcodegen generate && open QrmeStudio.xcodeproj
name: QrmeStudio
options:
  bundleIdPrefix: app.qrme
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  QrmeStudio:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrme.studio
        MARKETING_VERSION: "0.95.0"
        CURRENT_PROJECT_VERSION: "95000"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    # A generated Info.plist and an `info:` block are mutually exclusive:
    # GENERATE_INFOPLIST_FILE takes scalar INFOPLIST_KEY_* settings only, and
    # NSAppTransportSecurity is a dictionary. So the plist is written here —
    # and `path` is required, which is what the spec was missing.
    #
    # Kept outside Sources/ so XcodeGen does not also sweep the file it just
    # generated into the target as a resource.
    info:
      path: QrmeStudio-Info.plist
      properties:
        CFBundleDisplayName: QRME
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required before AVCaptureSession may run: iOS terminates the app
        # outright if a camera is opened without this string.
        NSCameraUsageDescription: >-
          QRME reads beacon QR codes so a profile can appear on the sticker
          in front of you. Frames stay on the device; only the code's id is
          sent.
        # Required before AVAudioRecorder may run, for the same reason: iOS
        # kills the app if the mic opens without it. Voice enrollment records
        # to this app's container and sends only the measurements.
        NSMicrophoneUsageDescription: >-
          QRME records a sample of your own voice so your profile can speak in
          it, with your permission. The recording stays on this device; only
          how long it ran and how many turns it held are sent.
        # Allow http://127.0.0.1:8000 in the Simulator (local dev backend).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
