<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Anonymous">
  <!-- The one face every anonymous profile wears.
       Deliberately identical for everybody. A per-profile silhouette — tinted,
       initialled, or generated from the id — would be a stable mark that
       follows one person across surfaces, which is the thing an anonymous
       profile is trying not to have. Sameness is the feature: two anonymous
       profiles must be indistinguishable at a glance, including when they are
       the same person and when they are not. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2550"/>
      <stop offset="1" stop-color="#1B1838"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="78" r="30" fill="#6C63C4"/>
  <path d="M46 168 c0 -32 24 -52 54 -52 s54 20 54 52 z" fill="#6C63C4"/>
</svg>
