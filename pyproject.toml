[project]
name = "qrme"
version = "0.65.0"
description = "AI synthetic profiles — relationship-aware, remembered, yours"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Bianchi" }]
keywords = ["ai", "synthetic-profiles", "llm", "relationships", "moderation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.117",
    "segno>=1.6",
    "httpx>=0.27",          # suite/gateway.py calls the mounted apps in-process
    # WebAuthn assertion verification (qrme/signatures.py). Not optional: a
    # signature module that parsed assertions without verifying them would
    # produce records that only look like evidence.
    "cryptography>=41",
]

[project.optional-dependencies]
# pyyaml is test-only: the container tests read docker/docker-compose.yml to
# check the harness and the image agree. Not a runtime dependency.
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/davidsbianchi1984/qrme"
Repository = "https://github.com/davidsbianchi1984/qrme"
Changelog = "https://github.com/davidsbianchi1984/qrme/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qrme*", "cloudgw*"]

# The starter portraits ship inside the package. Without this they exist in
# the repo and vanish on install — the same failure that made /app 404 in the
# container, and it would show up as every starter falling back to initials.
[tool.setuptools.package-data]
qrme = ["assets/portraits/*.webp", "assets/portraits/MANIFEST.json",
        "assets/desks/*.webp"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
testpaths = ["tests"]
