<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="QRME Studios">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181235"/>
      <stop offset="1" stop-color="#0d0a20"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#b39dff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </radialGradient>
  </defs>
  <!-- Maskable: the mark stays inside the safe circle (80% of the canvas). -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The persona orb with its identity ring — the same mark as the app brand. -->
  <circle cx="256" cy="256" r="120" fill="url(#orb)" opacity="0.2"/>
  <circle cx="256" cy="256" r="72" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7b5cff" stroke-width="14"
          stroke-dasharray="66 40" stroke-linecap="round" opacity="0.85"/>
</svg>
