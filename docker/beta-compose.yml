# The beta topology: three products and a gateway on one host.
#
# `docker-compose.yml` next door is a **test harness** — throwaway
# credentials, the stub model, and an `e2e` container that runs the flow and
# exits. This file is its production-shaped sibling: real secrets from
# `.env`, the real model, no verdict container, and a reverse proxy in front
# holding certificates for three domains.
#
#   docker compose -f docker/beta-compose.yml --env-file .env up -d --build
#
# See docs/beta-deploy.md for the checklist, and each product's
# docs/hosting.md for what its variables mean — this file does not restate
# them, because a second copy of a table is a second thing to drift.
#
# ## What each container is
#
# Every product image is a **two-stage build**: Node builds the console, and
# the Python API serves both it and the API on one origin. So there is no
# separate front-end to host and no CORS to arrange — one container per
# product, one domain each.
#
#   pdi       8100   the vault. Starts first; the other two seal into it.
#   qrme      8000   synthetic profiles
#   jim       8200   the health guardian
#   cloudgw   8300   shared: greater model, contributions, error reports
#   caddy     80/443 the only container with a published port
#
# `expose` rather than `ports` on the four services is deliberate: they speak
# plain HTTP and carry bearer tokens, so they are reachable only by the proxy
# on the compose network, never from the internet. Terminating TLS in front
# of them is not optional — see the TLS section of docs/hosting.md.
#
# ## Build contexts
#
# Defaults assume the three repositories are cloned as siblings:
#
#   /srv/qrme  /srv/jim-mini  /srv/pdi
#
# Override with QRME_CONTEXT / JIM_CONTEXT / PDI_CONTEXT for another layout.

services:

  # --- the vault ---------------------------------------------------------
  #
  # First, and healthy before anything else starts: QRME and JIM both seal
  # into it, and a product that starts without its vault starts degraded in
  # a way its callers cannot see.
  pdi:
    build:
      context: ${PDI_CONTEXT:-../../pdi}
    restart: unless-stopped
    environment:
      # Whoever holds this can decrypt. PDI's own hosting doc is blunt about
      # it: "If the operator sets PDI_MASTER_KEY, the operator can decrypt."
      # §8 of the deploy page: the vault's real voice. Empty means the
      # resident engine answers with its honest stub and says how to add
      # a model; the ollama container §8 runs joins this stack's network,
      # so the URL is its service name.
      PDI_OLLAMA_URL: ${PDI_OLLAMA_URL:-}
      PDI_RESIDENT_MODEL: ${PDI_RESIDENT_MODEL:-}
      PDI_MASTER_KEY: ${PDI_MASTER_KEY:?set PDI_MASTER_KEY in .env}
      PDI_ADMIN_TOKEN: ${PDI_ADMIN_TOKEN:?set PDI_ADMIN_TOKEN in .env}
      PDI_PUBLIC_URL: ${PDI_PUBLIC_URL:?set PDI_PUBLIC_URL in .env}
      PDI_DB: /data/pdi.db
      # The vault's own heartbeat (seconds between beats). Empty means no
      # in-process pulse and standing tasks wait for a caller — the
      # pre-0.88 posture. 60 is the documented beta value.
      PDI_RESIDENT_PULSE: ${PDI_RESIDENT_PULSE:-}
      # The stack's eyes (the renderer service below): fetch.render asks
      # here for a page as a person sees it. Named in this file rather
      # than .env because it is topology, not a secret — and named HERE,
      # in the environment block, because compose forwards only what a
      # service's block names. That lesson has its own changelog entry.
      PDI_RENDERER_URL: http://renderer:8400
      # The stack's ears (the ears service below): fetch.listen asks here
      # for the words said in a recording. Topology, not a secret, and
      # named in this block for the same forwards-only-what-a-block-names
      # reason as the eyes.
      PDI_EARS_URL: http://ears:8500
    volumes:
      - pdi-data:/data
    expose:
      - "8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- the eyes -----------------------------------------------------------
  # A real browser in its own container, one door: POST /render {url}
  # answers the page's text as a person meets it. The vault's fetch.render
  # tool asks here, so a JavaScript console stops reading as a title and a
  # dozen characters. The eyes look outward only — private and
  # stack-internal addresses are refused inside the sidecar, for the
  # target and for every subresource a page tries to load.
  renderer:
    build:
      context: ${QRME_CONTEXT:-..}/docker/renderer
    restart: unless-stopped
    expose:
      - "8400"

  # --- the ears -----------------------------------------------------------
  # A local speech-to-text model in its own container, one door:
  # POST /transcribe {url} answers the words said in a recording — audio
  # or video, ffmpeg makes one shape of either. The vault's fetch.listen
  # tool asks here, and the words are made on this machine: the recording
  # never leaves the facility to become text. The ears listen outward
  # only — private and stack-internal addresses are refused inside the
  # sidecar. The model weights are baked in at build (the first build
  # downloads them once); a running stack never reaches out for them.
  ears:
    build:
      context: ${QRME_CONTEXT:-..}/docker/ears
    restart: unless-stopped
    expose:
      - "8500"

  # --- the forge ----------------------------------------------------------
  # POST /forge {photo, shot} answers a 3-D head built from that one
  # photograph: geometry personalized to the face, the photograph as its
  # skin, and morph targets named as ARKit names them so the room's own
  # audio can move the mouth.
  #
  # It exists because the alternative was a subscription. The avatar shelf
  # was an import list; the provider we picked to replace it (Ready Player
  # Me) was bought by Netflix and shut down on 31 January 2026, and the two
  # production replacements price their API at eight hundred dollars a
  # month. A face is not a subscription, and a company that can be acquired
  # should not be able to take everybody's face with it.
  #
  # The landmarker's weights are baked in at build, exactly like the ears'
  # — a running forge never reaches out for a model. It looks only at the
  # bytes it is handed: no URL is fetched here, so nothing in this
  # container can be aimed at the stack behind it.
  forge:
    build:
      context: ${QRME_CONTEXT:-..}/docker/forge
    restart: unless-stopped
    expose:
      - "8600"

  # --- one-shot: mint the tenant tokens ----------------------------------
  #
  # The same `docker/bootstrap.py` the test harness runs, and for the same
  # reason: PDI's dev-open admin mode is open only to callers on the same
  # machine, and a container on a compose network is not that. It fails
  # closed, so this presents the admin token like a real deployment does.
  #
  # Runs as root because the `shared` volume is created empty and
  # root-owned; the product images run as non-root service users and only
  # read from it.
  #
  # Idempotent by validation: the script keeps a saved token that PDI still
  # honours and mints only when there is none, so a restart reuses the first
  # tenant instead of abandoning its records. See bootstrap.py's docstring.
  bootstrap:
    build:
      context: ${QRME_CONTEXT:-..}
    user: "0:0"
    depends_on:
      pdi:
        condition: service_healthy
    environment:
      PDI_URL: http://pdi:8100
      PDI_ADMIN_TOKEN: ${PDI_ADMIN_TOKEN:?}
    volumes:
      - shared:/shared
      - ./:/work:ro
    command: ["python", "/work/bootstrap.py"]
    restart: "no"

  # --- synthetic profiles ------------------------------------------------
  qrme:
    build:
      context: ${QRME_CONTEXT:-..}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      # The agent's spoken voice (qrme/spoken.py). Optional: empty means
      # profiles bind voices and the say route refuses, naming this variable.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # §8: the offline provider's local model — the same daemon the
      # vault's resident speaks through. Empty falls back to the coded
      # defaults, which point at loopback and answer honestly when
      # nothing listens there.
      QRME_OLLAMA_URL: ${QRME_OLLAMA_URL:-}
      QRME_OLLAMA_MODEL: ${QRME_OLLAMA_MODEL:-}
      # The stack's eyes, for the briefcase's read-once links — named in
      # this service's own block because compose forwards only what a
      # block names.
      # The mailbox this product sends verification and reset mail from.
      # Named here for the same forwards-only-what-a-block-names reason:
      # a value in .env that no block names reaches no container, and the
      # operator would have a mailbox that never sends.
      QRME_SMTP_HOST: ${QRME_SMTP_HOST:-}
      QRME_SMTP_PORT: ${QRME_SMTP_PORT:-}
      QRME_SMTP_USER: ${QRME_SMTP_USER:-}
      QRME_SMTP_FROM: ${QRME_SMTP_FROM:-}
      QRME_SMTP_PASSWORD: ${QRME_SMTP_PASSWORD:-}
      QRME_RENDERER_URL: http://renderer:8400
      # The stack's ears, for the briefcase's read-once links that are
      # recordings — same forwards-only-what-a-block-names reason.
      QRME_EARS_URL: http://ears:8500
      QRME_FORGE_URL: http://forge:8600
      QRME_FILM_PROVIDER: ${QRME_FILM_PROVIDER:-}
      QRME_FILM_URL: ${QRME_FILM_URL:-}
      QRME_FILM_KEY: ${QRME_FILM_KEY:-}
      # Advertised by GET /pair, so the QR a phone scans has to point at the
      # public name rather than the container.
      QRME_PUBLIC_URL: ${QRME_PUBLIC_URL:?set QRME_PUBLIC_URL in .env}
      # Empty means open signup, which is the beta's posture. Set a value
      # when account creation should need an invite key — the consoles ask
      # for it exactly when /health says the deployment is gated.
      QRME_SIGNUP_KEY: ${QRME_SIGNUP_KEY:-}
      QRME_DB: /data/qrme.db
      QRME_PDI_URL: http://pdi:8100
      # The real model, not the harness stub. Without a key the module falls
      # back to the deterministic stub and says so — which is the wrong
      # answer on a box testers are using, so both are set together.
      QRME_LLM: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      # Optional, and only so the owner has somewhere else to send
      # the deciding half when a provider declines to work a screen.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - shared:/shared
      - qrme-data:/data
    expose:
      - "8000"
    command: ["sh", "-c", ". /shared/qrme.env; exec uvicorn qrme.api:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- the health guardian -----------------------------------------------
  jim:
    build:
      context: ${JIM_CONTEXT:-../../jim-mini}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      JIM_PUBLIC_URL: ${JIM_PUBLIC_URL:?set JIM_PUBLIC_URL in .env}
      # Empty means open signup, same as QRME's key above.
      JIM_SIGNUP_KEY: ${JIM_SIGNUP_KEY:-}
      # The mailbox the far end is written from. Unset, farend.notify
      # prints the letter on the server and reports delivered: false --
      # honest, and still nobody told. The ladder ends at a person only
      # when these are set.
      JIM_SMTP_HOST: ${JIM_SMTP_HOST:-}
      JIM_SMTP_PORT: ${JIM_SMTP_PORT:-}
      JIM_SMTP_USER: ${JIM_SMTP_USER:-}
      JIM_SMTP_FROM: ${JIM_SMTP_FROM:-}
      JIM_SMTP_PASSWORD: ${JIM_SMTP_PASSWORD:-}
      JIM_DB: /data/jim.db
      JIM_QRME_URL: http://qrme:8000
      JIM_PDI_URL: http://pdi:8100
      JIM_LLM: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      # The house key for the spoken voice — how a deployment buys speech on
      # behalf of everybody who opens the app. Optional on purpose: `:-` and
      # not `:?`, because a deployment that does not pay for a voice is a
      # working deployment. Unset, every user gets the device's own
      # recogniser and speech, and `GET /voice/quota` says so rather than
      # degrading in silence. QRME reads the same variable now — the spoken
      # voice, qrme/spoken.py — so one key serves both products.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - shared:/shared
      - jim-data:/data
    expose:
      - "8200"
    command: ["sh", "-c", ". /shared/jim.env; exec uvicorn jim.api:app --host 0.0.0.0 --port 8200"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- the shared gateway ------------------------------------------------
  #
  # Its own image on purpose: several deployments share it, so it has a
  # different lifecycle and no reason to carry a Node toolchain. This is
  # also what makes the consoles' error reporting live — but only from the
  # next release, because the collector address is compiled into installers
  # at build time. See docs/cloudgw-deploy.md.
  #
  # The gateway does two jobs and this beta uses **one of them**, on purpose.
  #
  #   1. the error-report collector — used. That is what the `consoles` token
  #      and CLOUDGW_PROBLEM_READERS above are for.
  #   2. the greater model, and the contribution intake — **not** used. That
  #      is what QRME_CLOUD_URL / JIM_CLOUD_URL would switch on, and neither
  #      is set anywhere in this file.
  #
  # Which is why all three products answer `"cloud": false` on /health. Read
  # cold that looks like a container running for nothing, and it was listed as
  # an undecided question for two releases. It is decided here rather than
  # inferred again: setting those variables routes **inference** for everybody
  # on the box to the gateway's hosted tier, and the local provider stack
  # already works. A beta is not where you change which model answers.
  #
  # It is one edit away when that is wanted, and all three go together — a box
  # where two products use the greater model and the third does not is a box
  # answering the same question two ways:
  #
  #   QRME_CLOUD_URL: http://cloudgw:8300
  #   QRME_CLOUD_TOKEN: ${CLOUDGW_CONSOLES_TOKEN:?}
  #
  # Contribution stays opt-in per profile either way; pointing a product at
  # the gateway only makes the offer possible, it does not accept it.
  cloudgw:
    build:
      context: ${QRME_CONTEXT:-..}
      dockerfile: cloudgw/Dockerfile
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      CLOUDGW_TOKENS: ${CLOUDGW_TOKENS:?set CLOUDGW_TOKENS in .env}
      CLOUDGW_PROBLEM_READERS: ops
      CLOUDGW_PROBLEMS_PATH: /data/problems.json
    volumes:
      - cloudgw-data:/data
    expose:
      - "8300"

  # --- the nightly copy ----------------------------------------------------
  #
  # docs/beta-deploy.md § 6 called backups "the step most likely to be
  # skipped and most expensive to have skipped", and then left them as
  # instructions. This is the running job: once a day, a `.backup` of each
  # SQLite file and a copy of the collector's ledger into /root/backups on
  # the host, keeping fourteen days.
  #
  # `sqlite3 .backup` rather than `cp`, because copying a live database
  # mid-write produces a file that opens and lies. The backup API takes a
  # consistent snapshot while the products keep writing.
  #
  # What this is not: off-host. A dead disk takes the copies with it; these
  # cover the likelier failures — a bad deploy, a wrong deletion, a volume
  # removed by hand. Copying /root/backups somewhere else is still yours.
  backup:
    image: alpine:3
    restart: unless-stopped
    volumes:
      - pdi-data:/live/pdi:ro
      - qrme-data:/live/qrme:ro
      - jim-data:/live/jim:ro
      - cloudgw-data:/live/cloudgw:ro
      - /root/backups:/backups
    command:
      - sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          stamp=$$(date +%F)
          for name in pdi qrme jim; do
            db="/live/$$name/$$name.db"
            [ -f "$$db" ] && sqlite3 "$$db" ".backup /backups/$$name-$$stamp.db" \
              && echo "backup: $$name-$$stamp.db"
          done
          [ -f /live/cloudgw/problems.json ] \
            && cp /live/cloudgw/problems.json "/backups/problems-$$stamp.json"
          find /backups -name '*-20*' -mtime +14 -delete
          # The freshness marker: a backup loop that dies silently is
          # worse than none, and this is what the staleness check reads.
          date -u +%FT%TZ > /backups/.last-ok
          sleep 86400
        done

  # --- the only door to the internet -------------------------------------
  #
  # Caddy obtains and renews certificates for all four names by itself. The
  # `caddy-data` volume holds them: without it, every restart asks Let's
  # Encrypt for new ones and rate limits eventually refuse.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [qrme, jim, pdi, cloudgw]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./beta.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  shared:
  pdi-data:
  qrme-data:
  jim-data:
  cloudgw-data:
  caddy-data:
  caddy-config:
