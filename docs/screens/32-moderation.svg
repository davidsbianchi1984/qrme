<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14103a"/><stop offset="1" stop-color="#0b0820"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1648"/><stop offset="1" stop-color="#130f33"/></linearGradient>
  <radialGradient id="orb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#d9ccff"/><stop offset=".55" stop-color="#7b5cff"/><stop offset="1" stop-color="#3f3bc0"/></radialGradient>
</defs>
<rect width="430" height="932" fill="url(#bg)"/>
<rect x="10" y="10" width="40" height="40" rx="12" fill="#1a1445" stroke="#2c2560"/><text x="30" y="37" font-size="18" text-anchor="middle" fill="#efecff">☰</text>
<text x="32" y="98" font-size="26" font-weight="800" fill="#efecff">Moderation</text>
<text x="32" y="122" font-size="13" fill="#8b90a8">Review before a doubtful turn ships. Nothing here has been sent.</text>
<rect x="16" y="140" width="190" height="78" rx="16" fill="url(#card)" stroke="#2c2560"/><text x="32" y="166" font-size="12" font-weight="700" fill="#8b90a8">Pass rate</text><text x="32" y="200" font-size="26" font-weight="800" fill="#b9a4ff">98.6%</text>
<rect x="224" y="140" width="190" height="78" rx="16" fill="url(#card)" stroke="#2c2560"/><text x="240" y="166" font-size="12" font-weight="700" fill="#8b90a8">Waiting on you</text><text x="240" y="200" font-size="26" font-weight="800" fill="#ffb84d">3</text>
<text x="32" y="254" font-size="14" font-weight="800" fill="#efecff">Held turns</text>
<rect x="16" y="268" width="398" height="162" rx="16" fill="url(#card)" stroke="#2c2560"/>
<circle cx="44" cy="296" r="14" fill="#3a2f7a" stroke="#7b5cff"/><text x="44" y="300" font-size="9" font-weight="800" text-anchor="middle" fill="#9fd8e8">AI</text>
<text x="66" y="293" font-size="13" font-weight="700" fill="#efecff">Dr. Amara Osei</text><text x="66" y="309" font-size="10" fill="#8b90a8">to a visitor · 2 min ago</text>
<circle cx="392" cy="296" r="6" fill="#ffb84d"/>
<rect x="30" y="322" width="370" height="40" rx="10" fill="#0b0820" opacity=".7"/><text x="42" y="347" font-size="11.5" fill="#efecff">“You should stop the medication tonight and see how you feel.”</text>
<text x="32" y="382" font-size="10.5" fill="#8b90a8">Health advice as an instruction — this persona educates, never orders.</text>
<rect x="30" y="392" width="110" height="30" rx="10" fill="#43e08a"/><text x="85" y="412" font-size="12" font-weight="800" text-anchor="middle" fill="#0b0820">Approve</text>
<rect x="150" y="392" width="110" height="30" rx="10" fill="#0d0a20" stroke="#e0687a"/><text x="205" y="412" font-size="12" font-weight="800" text-anchor="middle" fill="#e0687a">Reject</text>
<rect x="270" y="392" width="130" height="30" rx="10" fill="#0d0a20" stroke="#2c2560"/><text x="335" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#efecff">Edit and send</text>
<rect x="16" y="444" width="398" height="162" rx="16" fill="url(#card)" stroke="#2c2560"/>
<circle cx="44" cy="472" r="14" fill="#3a2f7a" stroke="#7b5cff"/><text x="44" y="476" font-size="9" font-weight="800" text-anchor="middle" fill="#9fd8e8">AI</text>
<text x="66" y="469" font-size="13" font-weight="700" fill="#efecff">Marcus Bell</text><text x="66" y="485" font-size="10" fill="#8b90a8">to Priya Raman · 11 min ago</text>
<circle cx="392" cy="472" r="6" fill="#ffb84d"/>
<rect x="30" y="498" width="370" height="40" rx="10" fill="#0b0820" opacity=".7"/><text x="42" y="523" font-size="11.5" fill="#efecff">“Put everything into it before Friday, trust me on this one.”</text>
<text x="32" y="558" font-size="10.5" fill="#8b90a8">A specific investment instruction, which the profile is set never to give.</text>
<rect x="30" y="568" width="110" height="30" rx="10" fill="#43e08a"/><text x="85" y="588" font-size="12" font-weight="800" text-anchor="middle" fill="#0b0820">Approve</text>
<rect x="150" y="568" width="110" height="30" rx="10" fill="#0d0a20" stroke="#e0687a"/><text x="205" y="588" font-size="12" font-weight="800" text-anchor="middle" fill="#e0687a">Reject</text>
<rect x="270" y="568" width="130" height="30" rx="10" fill="#0d0a20" stroke="#2c2560"/><text x="335" y="588" font-size="12" font-weight="700" text-anchor="middle" fill="#efecff">Edit and send</text>
<rect x="16" y="620" width="398" height="162" rx="16" fill="url(#card)" stroke="#2c2560"/>
<circle cx="44" cy="648" r="14" fill="#3a2f7a" stroke="#7b5cff"/><text x="44" y="652" font-size="9" font-weight="800" text-anchor="middle" fill="#9fd8e8">AI</text>
<text x="66" y="645" font-size="13" font-weight="700" fill="#efecff">David Bianchi (AI)</text><text x="66" y="661" font-size="10" fill="#8b90a8">to a stranger · 40 min ago</text>
<circle cx="392" cy="648" r="6" fill="#e0687a"/>
<rect x="30" y="674" width="370" height="40" rx="10" fill="#0b0820" opacity=".7"/><text x="42" y="699" font-size="11.5" fill="#efecff">“I am the real David — call me and we can talk.”</text>
<text x="32" y="734" font-size="10.5" fill="#8b90a8">Claims to be the person; the watermark says otherwise.</text>
<rect x="30" y="744" width="110" height="30" rx="10" fill="#43e08a"/><text x="85" y="764" font-size="12" font-weight="800" text-anchor="middle" fill="#0b0820">Approve</text>
<rect x="150" y="744" width="110" height="30" rx="10" fill="#0d0a20" stroke="#e0687a"/><text x="205" y="764" font-size="12" font-weight="800" text-anchor="middle" fill="#e0687a">Reject</text>
<rect x="270" y="744" width="130" height="30" rx="10" fill="#0d0a20" stroke="#2c2560"/><text x="335" y="764" font-size="12" font-weight="700" text-anchor="middle" fill="#efecff">Edit and send</text>
<text x="32" y="826" font-size="14" font-weight="800" fill="#efecff">How this profile is moderated</text>
<rect x="16" y="838" width="398" height="52" rx="14" fill="url(#card)" stroke="#2c2560"/><text x="32" y="860" font-size="12" font-weight="700" fill="#efecff">Auto — hold anything doubtful</text><text x="32" y="878" font-size="10.5" fill="#8b90a8">Held turns wait here; approved ones ship watermarked, rejected ones never leave.</text>
<!-- the edge dock -->
<rect x="402" y="672" width="28" height="22" rx="8" fill="#ffffff14"/><text x="416" y="688" font-size="14" text-anchor="middle" fill="#8b90a8">⋮</text>
<rect x="386" y="700" width="50" height="44" rx="10" fill="#0d0a20e0" stroke="#2c2560"/><text x="408" y="729" font-size="16" font-weight="800" text-anchor="middle" fill="#9d7bff">?</text>
<rect x="386" y="750" width="50" height="44" rx="10" fill="#0d0a20e0" stroke="#43e08a" stroke-width="2"/><text x="408" y="781" font-size="18" text-anchor="middle">🚦</text>
</svg>