<svg xmlns="http://www.w3.org/2000/svg" width="236" height="300" viewBox="0 0 236 300" role="img" aria-label="Control watch screen"><defs>
      <linearGradient id="gScr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181235"/><stop offset="1" stop-color="#0c0920"/></linearGradient>
      <!-- The case gets its own gradient rather than the phone's. QRME's
           frameA (#2a2352) is *lighter* than the screen, which on a phone
           reads as the metal band catching the light and on a watch reads as
           a purple glow behind the whole device. A case is darker than the
           display it surrounds. -->
      <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141029"/><stop offset="1" stop-color="#07050f"/></linearGradient>
      <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#201a48"/><stop offset="1" stop-color="#181240"/></linearGradient>
      <linearGradient id="gBrand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#9d7bff"/></linearGradient>
      <linearGradient id="mV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#9d7bff"/></linearGradient>
      <linearGradient id="mO" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7b731"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
      <linearGradient id="mG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fd27a"/><stop offset="1" stop-color="#43e08a"/></linearGradient>
      <radialGradient id="orb" cx="34%" cy="30%" r="75%"><stop offset="0" stop-color="#c3b0ff"/><stop offset="42%" stop-color="#7b5cff"/><stop offset="80%" stop-color="#2f6cf0"/><stop offset="100%" stop-color="#14204a"/></radialGradient>
    </defs><rect x="212.0" y="118.0" width="7.0" height="34.0" rx="3" fill="#333c52"/><rect x="213.0" y="160.0" width="5.0" height="26.0" rx="2" fill="#2a3145"/><rect x="18.0" y="20.0" width="196.0" height="260.0" rx="60" fill="url(#gScr)" stroke="rgba(255,255,255,0.13)" stroke-width="1.2"/><text x="188.0" y="50.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="11" font-weight="700" fill="#ffb84d" text-anchor="end">10:09</text><text x="38.0" y="50.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="13" font-weight="700" fill="#f2effc" text-anchor="start" letter-spacing="-0.2">Control</text><rect x="38.0" y="66.0" width="156.0" height="40.0" rx="12" fill="url(#gCard)" stroke="#302a60" stroke-width="1"/><rect x="46.0" y="75.0" width="22.0" height="22.0" rx="7" fill="rgba(123,196,127,0.16)"/><circle cx="57" cy="86" r="2.4" fill="#7bc47f"/><text x="76.0" y="83.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="11" font-weight="650" fill="#f2effc" text-anchor="start">Approve reply</text><text x="76.0" y="96.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9" font-weight="400" fill="#9a93c6" text-anchor="start">held for you</text><rect x="38.0" y="114.0" width="156.0" height="40.0" rx="12" fill="url(#gCard)" stroke="#302a60" stroke-width="1"/><rect x="46.0" y="123.0" width="22.0" height="22.0" rx="7" fill="rgba(255,184,77,0.16)"/><circle cx="57" cy="134" r="2.4" fill="#ffb84d"/><text x="76.0" y="131.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="11" font-weight="650" fill="#f2effc" text-anchor="start">Assist agent</text><text x="76.0" y="144.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9" font-weight="400" fill="#9a93c6" text-anchor="start">one is waiting</text><rect x="38.0" y="162.0" width="156.0" height="40.0" rx="12" fill="url(#gCard)" stroke="#302a60" stroke-width="1"/><rect x="46.0" y="171.0" width="22.0" height="22.0" rx="7" fill="rgba(224,104,122,0.16)"/><circle cx="57" cy="182" r="2.4" fill="#e0687a"/><text x="76.0" y="179.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="11" font-weight="650" fill="#f2effc" text-anchor="start">Halt</text><text x="76.0" y="192.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="9" font-weight="400" fill="#9a93c6" text-anchor="start">stops the run</text><text x="118.0" y="252.0" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#6a6399" text-anchor="middle">the wrist adds reach, not powers</text><circle cx="98.0" cy="266" r="2" fill="#6a6399"/><circle cx="108.0" cy="266" r="2" fill="#6a6399"/><circle cx="118.0" cy="266" r="2" fill="#6a6399"/><circle cx="128.0" cy="266" r="2.6" fill="#f2effc"/><circle cx="138.0" cy="266" r="2" fill="#6a6399"/></svg>